<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Health Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #1b2530; --panel: #26333f; --panel-light: #2f3f4d;
    --line: #3d4d5a; --text: #e8edf0; --dim: #9fb0ba;
    --accent: #4fb3bf; --danger: #e06c5c; --ok: #5fbf7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 28px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--dim); font-size: 14px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px 28px; }
  select { background: var(--panel-light); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
  .dot.offline { background: var(--danger); }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 0 28px 28px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .chart-box { position: relative; height: 340px; }
  #anomalies { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
  #anomalies li { padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid var(--danger);
                  background: rgba(224, 108, 92, 0.08); border-radius: 4px; font-size: 13px; }
  #anomalies li.done { opacity: 0.5; border-left-color: var(--line); background: transparent; }
  #anomalies .meta { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .ack-btn { margin-top: 8px; background: var(--panel-light); color: var(--text); border: 1px solid var(--line);
             border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .ack-btn:hover { background: var(--line); }
  .badge { margin-top: 8px; color: var(--ok); font-size: 12px; font-weight: 600; }

  .tiles { display: flex; gap: 12px; flex-wrap: wrap; padding: 0 28px 16px; }
  .tile { flex: 1; min-width: 160px; padding: 14px 16px; border-radius: 10px; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line); border-left-width: 5px; }
  .tile.good { border-left-color: var(--ok); }
  .tile.bad { border-left-color: var(--danger); background: rgba(224, 108, 92, 0.1); }
  .tile.selected { outline: 2px solid var(--accent); }
  .tile-name { font-weight: 600; margin-bottom: 4px; }
  .tile-status { font-size: 13px; color: var(--dim); }
  .tile.bad .tile-status { color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>Machine Health Monitor</h1>
  <p>Live sensor readings and predictive-maintenance alerts</p>
</header>

<div class="controls">
  <span><span class="dot" id="dot"></span><span id="statusText">Connecting...</span></span>
  <select id="machine">
    <option value="MACHINE-A1">MACHINE-A1</option>
    <option value="MACHINE-B2">MACHINE-B2</option>
    <option value="MACHINE-C3">MACHINE-C3</option>
  </select>
  <select id="sensor">
    <option value="TEMPERATURE">Temperature</option>
    <option value="VIBRATION">Vibration</option>
    <option value="RPM">RPM</option>
  </select>
</div>

<section class="tiles" id="tiles"></section>

<main>
  <div class="panel">
    <h2>Live sensor trend</h2>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </div>
  <div class="panel">
    <h2>Recent anomalies</h2>
    <ul id="anomalies"><li class="done">Waiting for data...</li></ul>
  </div>
</main>

<script>
  const API = "http://localhost:8080/api";
  const POLL_MS = 3000;

  const machineSelect = document.getElementById("machine");
  const sensorSelect = document.getElementById("sensor");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const anomalyList = document.getElementById("anomalies");

  let anomalyFlags = [];

  const chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Reading",
        data: [],
        borderColor: "#4fb3bf",
        backgroundColor: "rgba(79, 179, 191, 0.15)",
        fill: true,
        tension: 0.25,
        pointRadius: (ctx) => (anomalyFlags[ctx.dataIndex] ? 6 : 2),
        pointBackgroundColor: (ctx) => (anomalyFlags[ctx.dataIndex] ? "#e06c5c" : "#4fb3bf"),
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      scales: {
        x: { ticks: { color: "#9fb0ba", maxRotation: 0, maxTicksLimit: 8 }, grid: { color: "#2f3f4d" } },
        y: { ticks: { color: "#9fb0ba" }, grid: { color: "#2f3f4d" } },
      },
      plugins: { legend: { labels: { color: "#e8edf0" } } },
    },
  });

  function setOnline(ok) {
    dot.classList.toggle("offline", !ok);
    statusText.textContent = ok ? "Connected to backend" : "Backend unreachable";
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  async function loadReadings() {
    const url = `${API}/sensors/readings/latest`
      + `?machineId=${encodeURIComponent(machineSelect.value)}`
      + `&sensorType=${sensorSelect.value}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error("readings request failed: " + response.status);
    const readings = await response.json();

    anomalyFlags = readings.map((r) => r.anomaly);
    chart.data.labels = readings.map((r) => new Date(r.timestamp).toLocaleTimeString());
    chart.data.datasets[0].data = readings.map((r) => r.value);
    chart.data.datasets[0].label = `${machineSelect.value} - ${sensorSelect.value}`;
    chart.update();
  }

  async function loadAnomalies() {
    const response = await fetch(`${API}/anomalies/recent`);
    if (!response.ok) throw new Error("anomalies request failed: " + response.status);
    const anomalies = await response.json();

    if (anomalies.length === 0) {
      anomalyList.innerHTML = '<li class="done">No anomalies detected yet.</li>';
      return;
    }

    anomalyList.innerHTML = anomalies.map((a) => `
      <li class="${a.acknowledged ? "done" : ""}">
        <strong>${escapeHtml(a.machineId)}</strong> - ${escapeHtml(a.sensorType)} = ${a.value.toFixed(2)}
        <div class="meta">${escapeHtml(a.reason)}</div>
        <div class="meta">${new Date(a.detectedAt).toLocaleString()}</div>
        ${a.acknowledged
          ? '<div class="badge">&#10003; Acknowledged</div>'
          : `<button class="ack-btn" onclick="acknowledge(${a.id})">Acknowledge</button>`}
      </li>`).join("");
  }

  async function loadMachineStatus() {
    const response = await fetch(`${API}/machines/status`);
    if (!response.ok) throw new Error("status request failed: " + response.status);
    const statuses = await response.json();

    const openByMachine = {};
    statuses.forEach((s) => { openByMachine[s.machineId] = s.openAnomalies; });

    document.getElementById("tiles").innerHTML = Array.from(machineSelect.options).map((option) => {
      const id = option.value;
      const open = openByMachine[id] || 0;
      const label = open > 0 ? `${open} open alert${open > 1 ? "s" : ""}` : "Healthy";
      const selected = id === machineSelect.value ? " selected" : "";
      return `<div class="tile ${open > 0 ? "bad" : "good"}${selected}" data-machine="${id}">
        <div class="tile-name">${id}</div>
        <div class="tile-status">${label}</div>
      </div>`;
    }).join("");
  }

  document.getElementById("tiles").addEventListener("click", (event) => {
    const tile = event.target.closest(".tile");
    if (!tile) return;
    machineSelect.value = tile.dataset.machine;
    refresh();
  });

  async function acknowledge(id) {
    try {
      await fetch(`${API}/anomalies/${id}/acknowledge`, { method: "PATCH" });
      refresh();
    } catch (error) {
      console.error("acknowledge failed", error);
    }
  }

  async function refresh() {
    try {
      await Promise.all([loadReadings(), loadAnomalies(), loadMachineStatus()]);
      setOnline(true);
    } catch (error) {
      console.error(error);
      setOnline(false);
    }
  }

  machineSelect.addEventListener("change", refresh);
  sensorSelect.addEventListener("change", refresh);

  refresh();
  setInterval(refresh, POLL_MS);
</script>

</body>
</html>
